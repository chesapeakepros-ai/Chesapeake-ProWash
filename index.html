                    <div className="metric"><div className="lbl">Hours</div><div className="val">{fmtHrs(job.manHours)}</div>{(job.expenses||[]).length > 0 && <div className="metric-sub">{(job.expenses||[]).length} exp</div>}</div>
                    <div className="metric"><div className="lbl">Profit</div><div className={`val job-sub ${c.profit >= 0 ? 'green' : 'red'}`}>{fmt$(c.profit)}</div></div>
                    <div className="metric"><div className="lbl">Margin</div><div className={`val job-num ${c.margin >= 0 ? 'green' : 'red'}`}>{fmtPct(c.margin)}</div></div>
                  </div>
                  <div className="job-tags">
                    {jobEmployeeIds(job).map(id => (employees || []).find(e => e.id === id)).filter(Boolean).map(e => (
                      <span key={e.id} className="badge badge-blue">👤 {e.name}</span>
                    ))}
                    {job.paid
                      ? <span className="badge badge-green">💰 Paid{job.paymentMethod ? ' · ' + (job.paymentMethod === 'Cash' ? '💵' : job.paymentMethod === 'Check' ? '📝' : '💳') + ' ' + job.paymentMethod : ''}</span>
                      : <span className="badge badge-yellow">⏳ Unpaid</span>}
                    {job.googleReview
                      ? <span className="badge badge-green">⭐ Reviewed{(() => { const names = jobReviewCollectors(job).map(id => ((employees||[]).find(e=>e.id===id)||{}).name).filter(Boolean); return names.length ? ' by ' + names.join(', ') : ''; })()}</span>
                      : <span className="badge badge-gray">No Review</span>}
                    {Number(job.tip) > 0 && <span className="badge badge-green">🎁 {fmt$(job.tip)} tip</span>}
                  </div>
                  <div className="job-pill">
                    <span>Labor ({fmtHrs(job.manHours)} × ${job.laborRate ?? laborRate}/hr){c.jobExps > 0 ? ` + ${fmt$(c.jobExps)} expenses` : ''}{c.commission > 0 ? ` + ${fmt$(c.commission)} commission` : ''}{c.bonus > 0 ? ` + ${fmt$(c.bonus)} review bonus` : ''}{c.fee > 0 ? ` + ${fmt$(c.fee)} fee` : ''}</span>
                    <span className="amt">{fmt$(c.labor + c.jobExps + c.commission + c.bonus + c.fee)}</span>
                  </div>
                  <div className="list-item-actions">
                    <button className="btn btn-sm btn-edit" onClick={() => openEdit(job)}><Icon name="edit" />Edit</button>
                    <button className="btn btn-sm btn-danger" onClick={() => handleDelete(job.id)}><Icon name="trash" />Delete</button>
                  </div>
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

// ─── Charts ─────────────────────────────────────────────────────
function BarChart({ labels, datasets, key: _ }) {
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, {
      type: 'bar',
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 14, font: { size: 12, weight: '600' }, padding: 16, color: chartText() } },
          tooltip: {
            callbacks: {
              label: ctx => ' ' + ctx.dataset.label + ': $' + (ctx.parsed.y || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
            }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11, weight: '600' }, color: chartAxis() } },
          y: { grid: { color: chartGrid() }, ticks: { font: { size: 11 }, color: chartAxis(), callback: v => '$' + v.toLocaleString() } }
        },
      }
    });
    return () => chartRef.current?.destroy();
  }, [labels, datasets]);
  return <canvas ref={ref} />;
}

function LineChart({ labels, datasets }) {
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 14, font: { size: 12, weight: '600' }, padding: 16, color: chartText() } },
          tooltip: {
            callbacks: {
              label: ctx => ' ' + ctx.dataset.label + ': $' + (ctx.parsed.y || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
            }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11, weight: '600' }, color: chartAxis() } },
          y: { grid: { color: chartGrid() }, ticks: { font: { size: 11 }, color: chartAxis(), callback: v => '$' + v.toLocaleString() } }
        },
        elements: { point: { radius: 4, hoverRadius: 6 }, line: { tension: 0.35, borderWidth: 2.5 } },
      }
    });
    return () => chartRef.current?.destroy();
  }, [labels, datasets]);
  return <canvas ref={ref} />;
}

function PieChart({ labels, data, colors, onSliceClick }) {
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(ref.current, {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 3, borderColor: cssVar('--surface', '#fff'), hoverOffset: 6 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        onClick: (evt, elements) => {
          if (elements.length > 0 && onSliceClick) onSliceClick(labels[elements[0].index]);
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ' ' + ctx.label + ': $' + (ctx.parsed || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
            }
          }
        },
        cutout: '68%',
      }
    });
    return () => chartRef.current?.destroy();
  }, [labels, data, colors]);
  return <canvas ref={ref} style={{ cursor: 'pointer' }} />;
}

// ─── Dashboard ──────────────────────────────────────────────────
function DashboardTab({ entries, jobs, setJobs, laborRate, expenseItems, bills, employees, reviewBonus, feeRate }) {
  const [period, setPeriod] = useState('week');
  const [offset, setOffset] = useState(0); // 0 = current period, -1 = previous, etc.
  const [selectedCat, setSelectedCat] = useState(null);
  useThemeVersion(); // redraw the chart when light/dark changes
  const changePeriod = p => { setPeriod(p); setOffset(0); };

  const todayStr = today();
  const [tyear, tmonth, tday] = todayStr.split('-').map(Number);
  const toStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  // Period date range, shifted back by `offset` days/weeks/months (Sunday–Saturday weeks)
  let periodStart, periodEnd, rangeLabel;
  if (period === 'today') {
    const d = new Date(tyear, tmonth - 1, tday + offset);
    periodStart = periodEnd = toStr(d);
    rangeLabel = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  } else if (period === 'week') {
    const base = new Date(tyear, tmonth - 1, tday);
    const wkStart = new Date(base); wkStart.setDate(base.getDate() - base.getDay() + offset * 7);
    const wkEnd = new Date(wkStart); wkEnd.setDate(wkStart.getDate() + 6);
    periodStart = toStr(wkStart); periodEnd = toStr(wkEnd);
    rangeLabel = wkStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' – ' + wkEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  } else {
    const mDate = new Date(tyear, tmonth - 1 + offset, 1);
    periodStart = toStr(new Date(mDate.getFullYear(), mDate.getMonth(), 1));
    periodEnd   = toStr(new Date(mDate.getFullYear(), mDate.getMonth() + 1, 0));
    rangeLabel = mDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  }
  if (periodEnd > todayStr) periodEnd = todayStr; // don't count days that haven't happened yet
  const unitName = period === 'today' ? 'day' : period === 'week' ? 'week' : 'month';
  const statsLabel = offset === 0 ? (period === 'today' ? 'Today' : period === 'week' ? 'This Week' : 'This Month') : rangeLabel;

  // Fixed overhead: total monthly bills, and the daily share (÷30) folded into each day's expenses
  const totalBills = (bills || []).reduce((s, b) => s + (Number(b.amount) || 0), 0);
  const dailyNut = totalBills / 30;

  const filterEntries = (start, end) => entries.filter(e => e.date >= start && e.date <= end);

  const rollup = es => es.reduce((acc, e) => {
    const c = calcEntry(e, jobs, laborRate, expenseItems, employees, dailyNut, feeRate);
    acc.revenue  += c.totalRevenue;
    acc.expenses += c.totalExp;
    acc.profit   += c.profit;
    acc.hours    += c.totalHours;
    acc.travel   += c.travelHours;
    acc.jobHours += c.jobHours;
    acc.overhead += c.overhead;
    return acc;
  }, { revenue: 0, expenses: 0, profit: 0, hours: 0, travel: 0, jobHours: 0, overhead: 0 });

  // On the Month tab, charge the FULL monthly bills as overhead (not just the
  // per-day share of days logged) — fixed bills are a whole-month obligation.
  const applyMonthOverhead = (s) => {
    if (period === 'month' && totalBills > 0) {
      const topUp = totalBills - s.overhead;
      s.expenses += topUp;
      s.profit   -= topUp;
      s.overhead  = totalBills;
    }
    return s;
  };
  const statsToShow = applyMonthOverhead(rollup(filterEntries(periodStart, periodEnd)));

  // ── Previous period (matched length) for comparison ──
  const startForOffset = (o) => {
    if (period === 'today') return new Date(tyear, tmonth - 1, tday + o);
    if (period === 'week')  { const b = new Date(tyear, tmonth - 1, tday); const w = new Date(b); w.setDate(b.getDate() - b.getDay() + o * 7); return w; }
    return new Date(tyear, tmonth - 1 + o, 1);
  };
  const daySpan = Math.round((Date.parse(periodEnd) - Date.parse(periodStart)) / 86400000) + 1;
  const prevStartDate = startForOffset(offset - 1);
  const prevEndDate = new Date(prevStartDate); prevEndDate.setDate(prevStartDate.getDate() + daySpan - 1);
  const prevStats = applyMonthOverhead(rollup(filterEntries(toStr(prevStartDate), toStr(prevEndDate))));

  // Percent change vs previous period; null when there's nothing to compare to
  const pctChange = (cur, prev) => (prev === 0 ? null : ((cur - prev) / Math.abs(prev)) * 100);
  // Renders a small ▲/▼ delta badge inside a dark stat card
  const deltaBadge = (cur, prev, goodWhenUp = true) => {
    const pct = pctChange(cur, prev);
    if (pct === null) return null;
    if (Math.abs(pct) < 0.5) return <div className="delta-even">~ even vs prev {unitName}</div>;
    const up = pct > 0;
    const good = goodWhenUp ? up : !up;
    return (
      <div className={'delta ' + (good ? 'good' : 'bad')}>
        {up ? '▲' : '▼'} {Math.abs(pct).toFixed(0)}% <span className="vs">vs prev {unitName}</span>
      </div>
    );
  };

  const periodJobs   = jobs.filter(j => j.dateStart >= periodStart && j.dateStart <= periodEnd);
  // Reviews only make sense for completed jobs - scheduled/cancelled jobs can't have one yet
  const completedPeriodJobs = periodJobs.filter(j => j.status === 'Completed');
  const reviewedJobs = completedPeriodJobs.filter(j => j.googleReview);
  const reviewPct    = completedPeriodJobs.length > 0 ? Math.round((reviewedJobs.length / completedPeriodJobs.length) * 100) : 0;

  // Unpaid completed jobs (all time) - money you're owed
  const unpaidJobs  = jobs.filter(j => j.status === 'Completed' && !j.paid);
  const unpaidTotal = unpaidJobs.reduce((s, j) => s + (Number(j.revenue) || 0), 0);

  // Overhead actually counted in this period (daily nut × days that have an entry),
  // already included in statsToShow.expenses / statsToShow.profit above.
  const periodOverhead = statsToShow.overhead;


  const jobsSorted = useMemo(() => {
    return [...jobs].map(j => ({ ...j, ...calcJob(j, laborRate, employees, expenseItems, reviewBonus, feeRate) })).sort((a, b) => b.margin - a.margin);
  }, [jobs, laborRate]);

  return (
    <div>
      <div className="period-row">
        <PeriodTabs period={period} onChange={changePeriod} />
        <RangeNav label={rangeLabel} offset={offset} unitName={unitName} setOffset={setOffset} />
      </div>

      <div className="stat-grid">
        <div className="stat-card tone-info">
          <div className="stat-label">Revenue</div>
          <div className="stat-value blue">{fmt$(statsToShow.revenue)}</div>
          <div className="stat-sub">{statsLabel}</div>
          {deltaBadge(statsToShow.revenue, prevStats.revenue, true)}
        </div>
        <div className="stat-card tone-loss">
          <div className="stat-label">Expenses</div>
          <div className="stat-value red">{fmt$(statsToShow.expenses)}</div>
          <div className="stat-sub">{statsToShow.revenue > 0 ? fmtPct(statsToShow.expenses/statsToShow.revenue*100) + ' of revenue' : statsLabel}</div>
          {deltaBadge(statsToShow.expenses, prevStats.expenses, false)}
        </div>
        <div className={`stat-card ${statsToShow.profit >= 0 ? 'tone-profit' : 'tone-loss'}`}>
          <div className="stat-label">Net Profit</div>
          <div className={`stat-value ${statsToShow.profit >= 0 ? 'green' : 'red'}`}>{fmt$(statsToShow.profit)}</div>
          <div className="stat-sub">{statsToShow.revenue > 0 ? fmtPct(statsToShow.profit/statsToShow.revenue*100) + ' margin' : '–'}</div>
          {deltaBadge(statsToShow.profit, prevStats.profit, true)}
        </div>
        <div className="stat-card tone-info">
          <div className="stat-label">Total Hours</div>
          <div className="stat-value blue">{fmtHrs(statsToShow.hours)}</div>
          <div className="stat-sub">{statsToShow.hours > 0 && statsToShow.revenue > 0 ? fmt$(statsToShow.revenue / statsToShow.hours) + '/hr' : '–'}</div>
        </div>
        <div className="stat-card tone-warn">
          <div className="stat-label">Travel Hours</div>
          <div className="stat-value orange">{fmtHrs(statsToShow.travel)}</div>
          <div className="stat-sub">of {fmtHrs(statsToShow.hours)} total</div>
        </div>
        <div className="stat-card tone-gold">
          <div className="stat-label">Google Reviews</div>
          <div className="stat-value gold">{reviewedJobs.length} ⭐</div>
          <div className="stat-sub">{completedPeriodJobs.length > 0 ? `${reviewPct}% of ${completedPeriodJobs.length} completed` : 'No completed jobs'}</div>
        </div>
      </div>

      <div className="dash-grid">
        {/* Break-even: daily overhead nut (now folded into each day's expenses) */}
        {totalBills > 0 && period !== 'month' && (
          <div className="card tone-info">
            <div className="card-title"><span><span className="dot" />Break-Even</span></div>
            <div className="split-row">
              <div className="note">Fixed overhead added to each day's expenses. You clear this much per day just to break even.</div>
              <div className="big-amt" style={{ color: 'var(--loss)' }}>{fmt$(dailyNut)}<small>/day</small></div>
            </div>
            <div className="foot-row">
              <span>Overhead counted {statsLabel.toLowerCase()}: {fmt$(periodOverhead)}</span>
              <span className={statsToShow.profit >= 0 ? 'status-good' : 'status-bad'}>
                {statsToShow.profit >= 0 ? '✓ Above break-even' : '✗ Below break-even'}
              </span>
            </div>
          </div>
        )}

        {/* Money owed - unpaid completed jobs */}
        {unpaidJobs.length > 0 && (
          <div className="card tone-warn">
            <div className="card-title">
              <span><span className="dot" />Money Owed</span>
              <span className="title-amt">{fmt$(unpaidTotal)}</span>
            </div>
            {unpaidJobs.map(j => (
              <div key={j.id} className="owed-row">
                <div style={{ minWidth: 0 }}>
                  <div className="owed-name">{j.client}</div>
                  <div className="owed-sub">{j.description ? j.description + ' · ' : ''}{fmtDate(j.dateStart)}</div>
                </div>
                <div className="owed-side">
                  <span className="owed-amt">{fmt$(j.revenue)}</span>
                  <button className="btn btn-sm btn-success"
                    onClick={() => { setJobs(prev => prev.map(x => x.id === j.id ? { ...x, paid: true } : x)); toast(j.client + ' marked paid'); }}>
                    Mark Paid
                  </button>
                </div>
              </div>
            ))}
            <p className="setting-help">Completed jobs not yet marked Paid. Tap Mark Paid, or edit the job in the Jobs tab.</p>
          </div>
        )}

        {/* Tax set-aside suggestion - month view only */}
        {period === 'month' && statsToShow.profit > 0 && (
          <div className="card tone-profit">
            <div className="card-title"><span><span className="dot" />Tax Set-Aside</span></div>
            <div className="split-row">
              <div className="note">
                Suggested amount to set aside this month for self-employment + income tax (30% of net profit). Not tax advice - confirm with your tax preparer.
              </div>
              <div className="big-amt" style={{ color: 'var(--profit)' }}>{fmt$(statsToShow.profit * 0.30)}</div>
            </div>
          </div>
        )}

        {/* Monthly overhead section — only shown on Month tab */}
        {period === 'month' && bills && bills.length > 0 && (
          <div className="card tone-loss">
            <div className="card-title"><span><span className="dot" />Monthly Overhead (Fixed Bills)</span></div>

            {/* Two-number banner: overhead vs net after bills */}
            <div className="mini-stats">
              <div className="mini-stat">
                <div className="lbl">Fixed Overhead</div>
                <div className="val">{fmt$(totalBills)}</div>
                <div className="sub">{bills.length} bill{bills.length !== 1 ? 's' : ''} / mo</div>
              </div>
              <div className="mini-stat">
                <div className="lbl">Overhead Counted</div>
                <div className="val">{fmt$(periodOverhead)}</div>
                <div className="sub">already in Net Profit above</div>
              </div>
            </div>

            {/* Bill list */}
            {bills.map(b => (
              <div key={b.id} className="row-line">
                <div className="person">
                  <span style={{ fontSize: 19 }}>{b.icon || '🧾'}</span>
                  <div>
                    <div className="row-title">{b.name}</div>
                    {b.vendor && <div className="row-sub">{b.vendor}</div>}
                  </div>
                </div>
                <div className="calc-value red">{fmt$(b.amount)}<span className="per">/mo</span></div>
              </div>
            ))}
            <div className="foot-row">
              <span>Daily avg overhead</span>
              <span className="calc-value red">{fmt$(totalBills / 30)}/day</span>
            </div>
          </div>
        )}

        {period === 'month' && bills && bills.length === 0 && (
          <div className="note-box wide-card">
            No fixed bills logged — add them in the <strong>Bills</strong> tab to see monthly overhead here.
          </div>
        )}

        {/* Expense Breakdown Pie */}
        {(() => {
          const cats = {};
          const catItems = {};
          const addItem = (cat, item) => {
            cats[cat] = (cats[cat] || 0) + (Number(item.amount) || 0);
            if (!catItems[cat]) catItems[cat] = [];
            catItems[cat].push(item);
          };
          // Expense log items for the selected period
          (expenseItems || []).filter(e => e.date >= periodStart && e.date <= periodEnd).forEach(e => {
            const cat = e.category || 'Misc';
            addItem(cat, { label: e.description || 'Expense', sub: e.vendor || e.date, amount: e.amount });
          });
          // Job-specific expenses for completed jobs in the selected period (matches the Expenses stat)
          completedPeriodJobs.forEach(j => {
            (j.expenses || []).forEach(e => {
              addItem('Job Expenses', { label: e.description || 'Job Expense', sub: j.client + ' - ' + j.dateStart, amount: e.amount });
            });
          });
          // Electronic payment processing fees for completed jobs in the selected period
          completedPeriodJobs.forEach(j => {
            const fee = processingFeeForJob(j, feeRate);
            if (fee > 0) addItem('Processing Fees', { label: j.client, sub: feeRate + '% of ' + fmt$(j.revenue), amount: fee });
          });
          // (Commission is intentionally excluded from the dashboard — logged as payroll expense instead)
          // Labor + daily quick-entry costs (gas / materials / misc) from entries in the period
          const periodEntries = entries.filter(e => e.date >= periodStart && e.date <= periodEnd);
          periodEntries.forEach(e => {
            const c = calcEntry(e, jobs, laborRate, expenseItems, employees, dailyNut, feeRate);
            if (c.labor > 0) addItem('Labor', { label: fmtDate(e.date), sub: fmtHrs(c.totalHours) + ' x $' + (Number(e.laborRate ?? laborRate)||30) + '/hr', amount: c.labor });
            if (c.gas > 0)       addItem('Gas/Fuel',  { label: fmtDate(e.date), sub: 'daily log', amount: c.gas });
            if (c.materials > 0) addItem('Materials', { label: fmtDate(e.date), sub: 'daily log', amount: c.materials });
            if (c.misc > 0)      addItem('Misc',      { label: fmtDate(e.date) + (e.miscNote ? ' · ' + e.miscNote : ''), sub: 'daily log', amount: c.misc });
          });
          // Fixed overhead actually counted this period (daily nut × days logged)
          if (periodOverhead > 0) addItem('Overhead', { label: 'Fixed bills', sub: period === 'month' ? 'full monthly bills' : fmt$(dailyNut) + '/day × days logged', amount: periodOverhead });

          const pieLabels = Object.keys(cats);
          const pieData   = Object.values(cats);
          const pieColors = ['#3182ce','#e53e3e','#d69e2e','#38a169','#805ad5','#dd6b20','#2b6cb0','#c53030','#0d9488','#db2777','#65a30d','#7c3aed','#ea580c','#0891b2'];
          if (pieLabels.length === 0) return null;
          const total = pieData.reduce((a,b)=>a+b,0);
          const modalItems = selectedCat ? (catItems[selectedCat] || []) : [];
          const modalTotal = modalItems.reduce((s,i) => s + (Number(i.amount)||0), 0);
          const modalColor = pieColors[pieLabels.indexOf(selectedCat)] || '#718096';
          return (
            <div className="card">
              <div className="card-title">Expense Breakdown</div>
              <div className="chart-wrap">
                <PieChart labels={pieLabels} data={pieData} colors={pieColors.slice(0, pieLabels.length)} onSliceClick={cat => setSelectedCat(cat)} />
                <div className="pie-center"><div><div className="lbl">Total</div><div className="val">{fmt$(total)}</div></div></div>
              </div>
              <div className="legend">
                {pieLabels.map((cat, i) => (
                  <div key={cat} className="legend-row" role="button" tabIndex={0} onClick={() => setSelectedCat(cat)}
                    onKeyDown={e => { if (e.key === 'Enter') setSelectedCat(cat); }}>
                    <div className="legend-name">
                      <span className="legend-swatch" style={{ background: pieColors[i] || '#718096' }} />
                      {cat}
                    </div>
                    <div className="legend-amt">
                      <b>{fmt$(pieData[i])}</b>
                      <span>{total > 0 ? fmtPct(pieData[i]/total*100) : ''}</span>
                      <Icon name="chevR" />
                    </div>
                  </div>
                ))}
              </div>

              {selectedCat && (
                <Sheet title={<><span className="title-swatch" style={{ background: modalColor }} />{selectedCat}</>} onClose={() => setSelectedCat(null)}>
                  {modalItems.length === 0
                    ? <div className="no-match">No items</div>
                    : modalItems.map((item, idx) => (
                        <div key={idx} className="sheet-item">
                          <div>
                            <div className="t">{item.label}</div>
                            {item.sub && <div className="s">{item.sub}</div>}
                          </div>
                          <span className="a">{fmt$(item.amount)}</span>
                        </div>
                      ))
                  }
                  <div className="sheet-total">
                    <span>Total</span>
                    <span className="a">{fmt$(modalTotal)}</span>
                  </div>
                </Sheet>
              )}
            </div>
          );
        })()}

        {/* Costs as % of Revenue */}
        {(() => {
          const revenue = statsToShow.revenue;
          const cats = {};
          const addC = (cat, amt) => { cats[cat] = (cats[cat] || 0) + (Number(amt) || 0); };
          (expenseItems || []).filter(e => e.date >= periodStart && e.date <= periodEnd).forEach(e => addC(e.category || 'Misc', e.amount));
          completedPeriodJobs.forEach(j => (j.expenses || []).forEach(e => addC('Job Expenses', e.amount)));
          completedPeriodJobs.forEach(j => addC('Processing Fees', processingFeeForJob(j, feeRate)));
          entries.filter(e => e.date >= periodStart && e.date <= periodEnd).forEach(e => {
            const c = calcEntry(e, jobs, laborRate, expenseItems, employees, dailyNut, feeRate);
            if (c.labor > 0)      addC('Labor', c.labor);
            if (c.gas > 0)        addC('Gas/Fuel', c.gas);
            if (c.materials > 0)  addC('Materials', c.materials);
            if (c.misc > 0)       addC('Misc', c.misc);
          });
          if (periodOverhead > 0) addC('Overhead', periodOverhead);

          const rows = Object.entries(cats).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
          if (rows.length === 0) return null;
          const totalCost = rows.reduce((s, [, v]) => s + v, 0);
          const pctOf = amt => revenue > 0 ? (amt / revenue) * 100 : 0;
          const totalPct = pctOf(totalCost);

          return (
            <div className="card">
              <div className="card-title">Costs as % of Revenue</div>
              {revenue > 0 ? (
                <>
                  <div className="split-row" style={{ marginBottom: 4 }}>
                    <span className="note">Every dollar of the {fmt$(revenue)} you brought in ({statsLabel}):</span>
                  </div>
                  <div className="split-row" style={{ marginBottom: 14 }}>
                    <span style={{ fontSize: 13.5, fontWeight: 700 }}>Total costs</span>
                    <span className="big-amt" style={{ fontSize: 20, color: 'var(--loss)' }}>{fmtPct(totalPct)}<small style={{ marginLeft: 6 }}>{fmt$(totalCost)}</small></span>
                  </div>
                  {rows.map(([cat, amt]) => {
                    const pct = pctOf(amt);
                    return (
                      <div key={cat} className="bar-row">
                        <div className="bar-top">
                          <span>{cat}</span>
                          <span><span>{fmtPct(pct)}</span><span className="amt">{fmt$(amt)}</span></span>
                        </div>
                        <div className="bar-track">
                          <div className="bar-fill" style={{ width: Math.min(100, pct) + '%' }} />
                        </div>
                      </div>
                    );
                  })}
                  <div className="foot-row">
                    <span>Kept as profit</span>
                    <span className={totalPct <= 100 ? 'status-good' : 'status-bad'} style={{ fontSize: 15 }}>{fmtPct(100 - totalPct)}</span>
                  </div>
                </>
              ) : (
                <div className="note" style={{ fontSize: 13, color: 'var(--muted)' }}>No revenue recorded for {statsLabel}, so costs can't be shown as a percentage of revenue. Costs this period total {fmt$(totalCost)}.</div>
              )}
            </div>
          );
        })()}

        {jobsSorted.length > 0 && (
          <div className="card wide-card">
            <div className="card-title">Job Profitability</div>
            <div className="table-head">
              <span>Client / Job</span>
              <span>Revenue</span>
              <span>Margin</span>
            </div>
            {jobsSorted.slice(0, 10).map(j => (
              <div key={j.id} className="job-row">
                <div style={{ minWidth: 0 }}>
                  <div className="job-name">{j.client}</div>
                  <div className="job-date">{j.description}</div>
                </div>
                <div>
                  <div className="job-num">{fmt$(j.revenue)}</div>
                  <div className="job-sub">{fmt$(j.profit)} profit</div>
                </div>
                <div>
                  <div className={`job-num ${j.margin >= 0 ? 'green' : 'red'}`}>{fmtPct(j.margin)}</div>
                  <span className={`badge ${j.status==='Completed'?'badge-green':j.status==='In Progress'?'badge-blue':'badge-yellow'}`}>{j.status}</span>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {jobsSorted.length === 0 && entries.length === 0 && (
        <div className="empty"><div className="empty-icon">📊</div><p>Add daily entries and jobs to see your dashboard stats and charts here.</p></div>
      )}
    </div>
  );
}

// ─── Settings ──────────────────────────────────────────────────
function SettingsTab({ laborRate, setLaborRate, entries, setEntries, jobs, setJobs, expenseItems, bills, employees, setEmployees, expenseCategories, setExpenseCategories, reviewBonus, setReviewBonus, feeRate, setFeeRate, user, syncState, signIn, signOut, onImport, onClearAll }) {
  const [rate, setRate] = useState(laborRate);
  const [saved, setSaved] = useState(false);
  const [importMsg, setImportMsg] = useState('');
  const [empName, setEmpName] = useState('');
  const [empRate, setEmpRate] = useState('');
  const [rateErr, setRateErr] = useState('');
  const fileRef = useRef(null);
  const [themePref, setThemePref] = useState(getThemePref);

  // Keep the input in sync if the saved rate loads/changes from the cloud
  useEffect(() => { setRate(laborRate); }, [laborRate]);

  const handleSave = () => {
    const r = Number(rate);
    if (!(r > 0)) { setRateErr('Enter a rate greater than $0 (numbers only).'); return; }
    setRateErr('');
    // Freeze the OLD rate onto every existing job/entry that isn't already
    // stamped, so changing the rate never alters anything entered before now.
    try {
      const oldRate = Number(laborRate) || 30;
      setJobs(prev => Array.isArray(prev) ? prev.map(j => (j && j.laborRate == null) ? { ...j, laborRate: oldRate } : j) : prev);
      setEntries(prev => Array.isArray(prev) ? prev.map(e => (e && e.laborRate == null) ? { ...e, laborRate: oldRate } : e) : prev);
    } catch (err) { /* even if freezing fails, still apply the new rate below */ }
    setLaborRate(r);
    setSaved(true); setTimeout(() => setSaved(false), 2000);
  };

  const addEmployee = () => {
    if (!empName.trim()) return;
    setEmployees(prev => [...prev, { id: uid(), name: empName.trim(), commissionRate: Number(empRate) || 0 }]);
    toast(empName.trim() + ' added');
    setEmpName(''); setEmpRate('');
  };
  const removeEmployee = id => {
    if (confirm('Remove this employee? Jobs assigned to them will become Unassigned.')) {
      setEmployees(prev => prev.filter(e => e.id !== id));
      toast('Employee removed');
    }
  };

  const exportCSV = () => {
    const dailyNut = (bills || []).reduce((s, b) => s + (Number(b.amount) || 0), 0) / 30;
    const rows = [['Date','Job Revenue','Additional Revenue','Total Revenue','Man Hours','Job Hours','Travel Hours','Labor Cost','Gas','Materials','Misc','Misc Note','Overhead','Total Expenses','Net Profit','Margin %']];
    entries.forEach(e => {
      const c = calcEntry(e, jobs, laborRate, expenseItems, employees, dailyNut, feeRate);
      rows.push([e.date, c.jobRevenue.toFixed(2), c.additionalRevenue.toFixed(2), c.totalRevenue.toFixed(2), c.totalHours, c.jobHours.toFixed(2), c.travelHours.toFixed(2), c.labor.toFixed(2), e.gas||0, e.materials||0, e.misc||0, e.miscNote||'', c.overhead.toFixed(2), c.totalExp.toFixed(2), c.profit.toFixed(2), c.margin.toFixed(1)]);
    });
    const csv = rows.map(r => r.map(csvCell).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `cpw-entries-${today()}.csv`; a.click();
    URL.revokeObjectURL(url);
  };

  const exportJobsCSV = () => {
    const empName = id => (employees || []).find(e => e.id === id)?.name || '';
    const rows = [['Client','Description','Start Date','End Date','Revenue','Man Hours','Labor Cost','Job Expenses','Commission','Review Bonus','Processing Fee','Tip','Profit','Margin %','Status','Paid','Payment Method','Google Review','Review Collected By','Employees']];
    jobs.forEach(j => {
      const c = calcJob(j, laborRate, employees, expenseItems, reviewBonus, feeRate);
      rows.push([j.client, j.description, j.dateStart, j.dateEnd||'', j.revenue, j.manHours, c.labor.toFixed(2), c.jobExps.toFixed(2), c.commission.toFixed(2), c.bonus.toFixed(2), c.fee.toFixed(2), (Number(j.tip)||0).toFixed(2), c.profit.toFixed(2), c.margin.toFixed(1), j.status, j.paid ? 'Yes' : 'No', j.paymentMethod || '', j.googleReview ? 'Yes' : 'No', jobReviewCollectors(j).map(empName).filter(Boolean).join('; '), jobEmployeeIds(j).map(empName).filter(Boolean).join('; ')]);
    });
    const csv = rows.map(r => r.map(csvCell).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `cpw-jobs-${today()}.csv`; a.click();
    URL.revokeObjectURL(url);
  };

  const exportBackup = () => {
    const data = JSON.stringify({ entries, jobs, expenses: expenseItems, bills, laborRate }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `cpw-backup-${today()}.json`; a.click();
    URL.revokeObjectURL(url);
  };

  const handleImportFile = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (!d || (!Array.isArray(d.entries) && !Array.isArray(d.jobs))) {
          setImportMsg('That file does not look like a CPW backup.');
          return;
        }
        if (!confirm('Restore this backup? It will REPLACE all current data on every synced device.')) return;
        onImport(d);
        setImportMsg('Backup restored successfully.');
        setTimeout(() => setImportMsg(''), 4000);
      } catch {
        setImportMsg('Could not read that file - it is not valid JSON.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  return (
    <div className="settings-grid">
      <div className="card">
        <div className="card-title">Google Sync</div>
        {user ? (
          <div className="setting-row">
            <div className="account">
              {user.photoURL && <img src={user.photoURL} alt="" />}
              <div style={{ minWidth: 0 }}>
                <div className="setting-label" style={{ margin: 0 }}>{user.displayName}</div>
                <div className="row-sub">{user.email}</div>
              </div>
            </div>
            <div className="setting-help" style={{ margin: '0 0 12px' }}>✅ Your data syncs automatically across all devices.</div>
            <button className="btn btn-edit btn-block" onClick={signOut}>Sign Out</button>
          </div>
        ) : (
          <div className="setting-row">
            <div className="setting-help" style={{ margin: '0 0 12px' }}>Sign in with Google to sync your data between your phone and computer automatically.</div>
            <button className="btn-google" onClick={signIn}>
              <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
              Sign in with Google
            </button>
          </div>
        )}
      </div>

      <div className="card">
        <div className="card-title">Appearance</div>
        <div className="pill-group">
          {[['auto', 'Automatic'], ['light', 'Light'], ['dark', 'Dark']].map(([v, l]) => (
            <button key={v} className={'pill' + (themePref === v ? ' active' : '')} onClick={() => { applyTheme(v); setThemePref(v); }}>{l}</button>
          ))}
        </div>
        <div className="setting-help">Automatic follows your phone or computer's light/dark setting. Saved on this device only.</div>
      </div>

      <div className="card">
        <div className="card-title">Labor Rate</div>
        <div className="setting-row">
          <div className="setting-label">Cost per Man-Hour</div>
          <div className="inline-row">
            <div className="input-prefix">
              <span>$</span>
              <input type="number" inputMode="decimal" value={rate}
              onChange={e => setRate(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') handleSave(); }}
              min="1" step="0.50" />
            </div>
            <button type="button" className="btn btn-primary" onClick={handleSave}>
              {saved ? '✓ Saved' : 'Save'}
            </button>
          </div>
          {rateErr && <div className="info-note form-err">{rateErr}</div>}
          <div className="setting-help">
            Covers wage + payroll tax burden. Applied to labor going forward. Changing it will NOT affect jobs or days you already logged — those keep the rate they were entered at.
          </div>
          {user && syncState === 'error' && (
            <div className="info-note form-err">
              ⚠ This device saved your change, but it isn't reaching the cloud (check your connection or Firestore rules). Until it syncs, the change may be lost when you reload or open another device.
            </div>
          )}
        </div>
      </div>

      <div className="card">
        <div className="card-title">Payment Processing</div>
        <div className="setting-row">
          <div className="setting-label">Electronic Payment Fee</div>
          <div className="input-prefix">
            <span>%</span>
            <input type="number" inputMode="decimal" value={feeRate}
              onChange={e => setFeeRate(e.target.value === '' ? '' : Number(e.target.value))}
              min="0" step="0.1" />
          </div>
          <div className="setting-help">
            Automatically deducted from any job marked paid by Electronic payment (card, Venmo, Zelle, etc.), since that % never reaches your bank.
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-title">Employees / Crew</div>
        <div className="setting-row">
          {(employees || []).length === 0 && (
            <p className="setting-help" style={{ margin: '0 0 10px' }}>No employees yet. Add your crew below, then assign them to jobs.</p>
          )}
          {(employees || []).map(emp => (
            <div key={emp.id} className="row-line">
              <div className="person">
                <div className="avatar">{initialsOf(emp.name)}</div>
                <div>
                  <div className="row-title">{emp.name}</div>
                  <div className="row-sub">{Number(emp.commissionRate) > 0 ? `${emp.commissionRate}% commission` : 'No commission set'}</div>
                </div>
              </div>
              <button className="btn btn-sm btn-danger" onClick={() => removeEmployee(emp.id)}>Remove</button>
            </div>
          ))}
          <div className="form-grid" style={{ marginTop: 12 }}>
            <div className="form-group span2">
              <label>Employee Name</label>
              <input value={empName} onChange={e => setEmpName(e.target.value)} placeholder="e.g. Mike R." />
            </div>
            <div className="form-group">
              <label>Commission %</label>
              <input type="number" inputMode="decimal" value={empRate} onChange={e => setEmpRate(e.target.value)} placeholder="e.g. 20" min="0" max="100" step="1" />
            </div>
            <div className="form-group" style={{ justifyContent: 'flex-end' }}>
              <button className="btn btn-primary" onClick={addEmployee}><Icon name="plus" />Add Employee</button>
            </div>
          </div>
          <p className="setting-help">Commission % is applied to the revenue of each job the employee completes, shown in the Crew tab.</p>

          <div className="form-block">
            <div className="setting-label">Google Review Bonus</div>
            <div className="input-prefix">
              <span>$</span>
              <input type="number" inputMode="decimal" value={reviewBonus}
                onChange={e => setReviewBonus(e.target.value === '' ? '' : Number(e.target.value))}
                min="0" step="1" />
            </div>
            <p className="setting-help">Paid to the tech when a job is marked ⭐ Reviewed. Split evenly if more than one tech worked the job.</p>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-title">Expense Categories</div>
        <div className="setting-row">
          <p className="setting-help" style={{ margin: '0 0 8px' }}>Built-in categories (always available):</p>
          <div className="cat-pills" style={{ marginBottom: 14 }}>
            {BUILTIN_CATEGORIES.map(c => (
              <span key={c} className={`exp-cat-pill ${catMeta(c).cls}`}>{catMeta(c).icon} {c}</span>
            ))}
          </div>
          {(expenseCategories || []).length > 0 ? (
            <>
              <p className="setting-help" style={{ margin: '0 0 4px' }}>Your custom categories:</p>
              {(expenseCategories || []).map(c => (
                <div key={c} className="row-line">
                  <span className="row-title">🏷️ {c}</span>
                  <button className="btn btn-sm btn-danger" onClick={() => {
                    if (confirm('Remove this category? Expenses already logged with it keep their label.')) {
                      setExpenseCategories(prev => (prev || []).filter(x => x !== c));
                      toast('Category removed');
                    }
                  }}>Remove</button>
                </div>
              ))}
            </>
          ) : (
            <p className="setting-help">No custom categories yet. Add one while logging an expense in the Expenses tab (tap "+ New Category").</p>
          )}
        </div>
      </div>

      <div className="card">
        <div className="card-title">Export Data</div>
        <div className="setting-row export-list">
          <button className="btn btn-edit" onClick={exportCSV}>
            📥 Export Daily Entries (CSV)
          </button>
          <button className="btn btn-edit" onClick={exportJobsCSV}>
            📥 Export Jobs (CSV)
          </button>
          <button className="btn btn-edit" onClick={exportBackup}>
            💾 Backup All Data (JSON)
          </button>
          <button className="btn btn-edit" onClick={() => fileRef.current && fileRef.current.click()}>
            📤 Restore from Backup File
          </button>
          <input ref={fileRef} type="file" accept=".json,application/json" style={{ display: 'none' }} onChange={handleImportFile} />
          {importMsg && <p className="info-note">{importMsg}</p>}
        </div>
      </div>

      <div className="card">
        <div className="card-title">Automatic Backups</div>
        <div className="setting-row">
          {(() => {
            const backups = LS.get('cpw_backups', []).slice().reverse();
            if (backups.length === 0) return <p className="setting-help" style={{ margin: 0 }}>The app now keeps a daily snapshot of your data on this device automatically. They'll appear here as you use it, so you always have something to restore from.</p>;
            return (
              <>
                <p className="setting-help" style={{ margin: '0 0 4px' }}>Saved automatically on this device. Tap Restore to roll back to that day's data.</p>
                {backups.map(b => (
                  <div key={b.day} className="row-line">
                    <div>
                      <div className="row-title">{fmtDate(b.day)}</div>
                      <div className="row-sub">{(b.data.entries||[]).length} days · {(b.data.jobs||[]).length} jobs · {(b.data.expenses||[]).length} expenses</div>
                    </div>
                    <button className="btn btn-sm btn-edit" onClick={() => {
                      if (confirm('Restore your data to how it was on ' + fmtDate(b.day) + '? This replaces current data on all your devices.')) { onImport(b.data); toast('Restored ' + fmtDate(b.day)); }
                    }}>Restore</button>
                  </div>
                ))}
              </>
            );
          })()}
        </div>
      </div>

      <div className="card">
        <div className="card-title">About</div>
        <div className="setting-row about">
          <Logo />
          <div className="setting-help" style={{ margin: 0, lineHeight: 1.6 }}>
            <strong>Chesapeake Pro Wash</strong><br />
            Profitability Tracker v2.0<br />
            Sign in with Google to sync across devices.<br />
            Data is also saved on this device as a backup.
          </div>
        </div>
      </div>

      <div className="card danger-zone">
        <div className="card-title">Danger Zone</div>
        <div className="setting-row">
          <button className="btn btn-danger btn-block" onClick={onClearAll}>
            🗑 Clear All Data
          </button>
          <p className="setting-help">Deletes everything on this device AND in the cloud. Export a backup first.</p>
        </div>
      </div>
    </div>
  );
}

// ─── Bills Tab ─────────────────────────────────────────────────
const BILL_ICONS = ['💡','📱','🚗','🏠','🌐','🛡️','⚙️','🔧','💧','📦','🧾','💼'];
const EMPTY_BILL = { name: '', vendor: '', amount: '', icon: '💡', category: 'Misc' };

function BillsTab({ bills, setBills, expenseCategories, setExpenseCategories }) {
  const [newCat, setNewCat]     = useState('');
  const [showNewCat, setShowNewCat] = useState(false);
  const addCategory = () => {
    const name = newCat.trim();
    if (!name) return;
    const exists = allCategories(expenseCategories).some(c => c.toLowerCase() === name.toLowerCase());
    if (!exists) setExpenseCategories(prev => [...(prev || []), name]);
    setForm(f => ({ ...f, category: name }));
    setNewCat(''); setShowNewCat(false);
  };
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId]     = useState(null);
  const [form, setForm]         = useState(EMPTY_BILL);
  const [formErr, setFormErr]   = useState('');

  const handleChange = e => { const { name, value } = e.target; setForm(f => ({ ...f, [name]: value })); };

  const openNew  = () => { setEditId(null); setForm(EMPTY_BILL); setFormErr(''); setShowNewCat(false); setNewCat(''); setShowForm(true); };
  const openEdit = b  => { setEditId(b.id); setForm({ ...EMPTY_BILL, ...b }); setFormErr(''); setShowNewCat(false); setNewCat(''); setShowForm(true); };
  const closeForm = () => { setShowForm(false); setEditId(null); setForm(EMPTY_BILL); setFormErr(''); setShowNewCat(false); setNewCat(''); };

  const handleSubmit = () => {
    if (!form.name || !form.amount) { setFormErr('Bill name and amount are required.'); return false; }
    setFormErr('');
    if (editId) {
      setBills(prev => prev.map(b => b.id === editId ? { ...form, id: editId } : b));
    } else {
      setBills(prev => [...prev, { ...form, id: uid() }]);
    }
    toast(editId ? 'Bill updated' : 'Bill added');
    return true; // the sheet closes itself, which resets the form
  };

  const handleDelete = id => {
    if (confirm('Remove this bill?')) { setBills(prev => prev.filter(b => b.id !== id)); toast('Bill removed'); }
  };

  const totalMonthly = bills.reduce((s, b) => s + (Number(b.amount) || 0), 0);

  return (
    <div>
      {!showForm && <Fab label="Add bill" onClick={openNew} />}

      {showForm && (
        <Sheet title={editId ? 'Edit Bill' : 'New Monthly Bill'} onClose={closeForm}
          footer={close => (
            <>
              {formErr && <p className="info-note form-err">{formErr}</p>}
              <button className="btn btn-ghost" onClick={() => close()}>Cancel</button>
              <button className="btn btn-primary" onClick={() => { if (handleSubmit()) close(true); }}>{editId ? 'Save Changes' : 'Save Bill'}</button>
            </>
          )}>
          {/* Icon picker */}
          <div className="form-group" style={{ marginBottom: 14 }}>
            <label>Icon</label>
            <div className="icon-pick">

const CATEGORY_META = {
  'Gas/Fuel':   { icon: '⛽', cls: 'exp-cat-gas' },
  'Materials':  { icon: '🧴', cls: 'exp-cat-materials' },
  'Equipment':  { icon: '🔧', cls: 'exp-cat-equipment' },
  'Misc':       { icon: '📦', cls: 'exp-cat-misc' },
};
const BUILTIN_CATEGORIES = Object.keys(CATEGORY_META);
// Icon + style for any category, including custom ones (which get a default look)
const catMeta = cat => CATEGORY_META[cat] || { icon: '🏷️', cls: 'exp-cat-misc' };
// Full list = built-ins + any custom categories the user added
const allCategories = custom => {
  const seen = new Set(BUILTIN_CATEGORIES);
  const extra = (custom || []).filter(c => c && !seen.has(c));
  return [...BUILTIN_CATEGORIES, ...extra];
};
const EMPTY_EXP = { date: today(), description: '', amount: '', vendor: '', category: 'Misc', jobId: '' };

function ExpensesTab({ expenseItems, setExpenseItems, entries, setEntries, expenseCategories, setExpenseCategories, jobs }) {
  const [newCat, setNewCat]     = useState('');
  const [showNewCat, setShowNewCat] = useState(false);
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId]     = useState(null);
  const [form, setForm]         = useState(EMPTY_EXP);
  const [filterDate, setFilterDate] = useState('');
  const [formErr, setFormErr]   = useState('');
  const origForm = useRef('');

  const handleChange = e => { const { name, value } = e.target; setForm(f => ({ ...f, [name]: value })); };

  const addCategory = () => {
    const name = newCat.trim();
    if (!name) return;
    const exists = allCategories(expenseCategories).some(c => c.toLowerCase() === name.toLowerCase());
    if (!exists) setExpenseCategories(prev => [...(prev || []), name]);
    setForm(f => ({ ...f, category: name })); // auto-select the new (or existing) category
    setNewCat(''); setShowNewCat(false);
  };

  const ensureDailyEntry = date => {
    setEntries(prev => {
      if (prev.some(e => e.date === date)) return prev;
      return [{ id: uid(), date, additionalRevenue: '', manHours: '', gas: '', materials: '', misc: '', miscNote: '' }, ...prev];
    });
  };

  const openNew  = () => { setEditId(null); const f = { ...EMPTY_EXP, date: today() }; setForm(f); origForm.current = JSON.stringify(f); setFormErr(''); setShowNewCat(false); setNewCat(''); setShowForm(true); };
  const openEdit = item => { setEditId(item.id); setForm(item); origForm.current = JSON.stringify(item); setFormErr(''); setShowNewCat(false); setNewCat(''); setShowForm(true); };
  // OK to close the form? Only asks when something was changed.
  const confirmDiscard = () => JSON.stringify(form) === origForm.current || confirm('Discard unsaved changes?');
  const resetForm = () => { setShowForm(false); setEditId(null); setForm(EMPTY_EXP); setFormErr(''); };

  // Returns true once saved, so the sheet knows it can close.
  const handleSubmit = () => {
    if (!form.description || !form.amount || !form.date) { setFormErr('Description, amount, and date are all required.'); return false; }
    setFormErr('');
    if (editId) {
      setExpenseItems(prev => prev.map(e => e.id === editId ? { ...form, id: editId } : e));
    } else {
      setExpenseItems(prev => [{ ...form, id: uid() }, ...prev]);
      ensureDailyEntry(form.date);
    }
    toast(editId ? 'Expense updated' : 'Expense logged');
    return true;
  };

  const handleDelete = id => {
    if (confirm('Delete this expense?')) { setExpenseItems(prev => prev.filter(e => e.id !== id)); toast('Expense deleted'); }
  };

  const displayed = filterDate
    ? expenseItems.filter(e => e.date === filterDate)
    : expenseItems;

  // Group by date for display
  const grouped = displayed.reduce((acc, e) => {
    (acc[e.date] = acc[e.date] || []).push(e);
    return acc;
  }, {});
  const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));

  const totalShown = displayed.reduce((s, e) => s + (Number(e.amount) || 0), 0);

  return (
    <div>
      {!showForm && <Fab label="Log expense" onClick={openNew} />}

      {showForm && (
        <Sheet title={editId ? 'Edit Expense' : 'New Expense'} onClose={resetForm} confirmClose={confirmDiscard}
          footer={close => (
            <>
              {formErr && <p className="info-note form-err">{formErr}</p>}
              <button className="btn btn-ghost" onClick={() => close()}>Cancel</button>
              <button className="btn btn-primary" onClick={() => { if (handleSubmit()) close(true); }}>{editId ? 'Save Changes' : 'Log Expense'}</button>
            </>
          )}>
          <div className="form-grid">
            <div className="form-group span2">
              <label>Date</label>
              <input type="date" name="date" value={form.date} onChange={handleChange} />
            </div>
            <div className="form-group span2">
              <label>What was it?</label>
              <input name="description" value={form.description} onChange={handleChange} placeholder="e.g. Surface Cleaner Detergent" />
            </div>
            <div className="form-group">
              <label>Amount</label>
              <div className="input-prefix">
                <span>$</span>
                <input type="number" inputMode="decimal" name="amount" value={form.amount} onChange={handleChange} placeholder="0.00" step="0.01" min="0" />
              </div>
            </div>
            <div className="form-group">
              <label>Category</label>
              <select name="category" value={form.category} onChange={handleChange}>
                {allCategories(expenseCategories).map(c => <option key={c}>{c}</option>)}
              </select>
            </div>
            <div className="form-group span2">
              {!showNewCat ? (
                <button type="button" className="btn btn-edit btn-sm" style={{ alignSelf: 'flex-start' }} onClick={() => setShowNewCat(true)}>+ New Category</button>
              ) : (
                <div className="form-group">
                  <label>New Category Name</label>
                  <div className="inline-row">
                    <input value={newCat} onChange={e => setNewCat(e.target.value)} placeholder="e.g. Insurance, Truck Repair" />
                    <button type="button" className="btn btn-primary" onClick={addCategory}>Add</button>
                    <button type="button" className="btn btn-ghost btn-sm" onClick={() => { setShowNewCat(false); setNewCat(''); }}>Cancel</button>
                  </div>
                </div>
              )}
            </div>
            <div className="form-group span2">
              <label>Where from? (store / vendor)</label>
              <input name="vendor" value={form.vendor} onChange={handleChange} placeholder="e.g. Home Depot, Amazon…" />
            </div>
            <div className="form-group span2">
              <label>Assign to Job (optional)</label>
              <select name="jobId" value={form.jobId || ''} onChange={handleChange}>
                <option value="">— Not tied to a job —</option>
                {[...(jobs || [])].sort((a,b) => (b.dateStart||'').localeCompare(a.dateStart||'')).map(j => (
                  <option key={j.id} value={j.id}>{j.client}{j.dateStart ? ` · ${fmtDate(j.dateStart)}` : ''}</option>
                ))}
              </select>
              {(jobs || []).length === 0 && <span className="field-hint quiet">Add jobs in the Jobs tab to assign expenses to them.</span>}
            </div>
          </div>
          <p className="info-note">This expense appears in the Daily Entry for {fmtDate(form.date) || 'this date'}{form.jobId ? ", and is deducted from the assigned job's profit" : ''}.</p>
        </Sheet>
      )}

      {expenseItems.length > 0 && (
        <div className="card filter-card">
          <div className="card-title">Filter by Date</div>
          <div className="inline-row">
            <input type="date" value={filterDate} onChange={e => setFilterDate(e.target.value)} />
            {filterDate && <button className="btn btn-ghost btn-sm" onClick={() => setFilterDate('')}>Clear</button>}
          </div>
          {filterDate && (
            <div className="filter-summary">
              <span>{displayed.length} item{displayed.length !== 1 ? 's' : ''}</span>
              <b>Total: {fmt$(totalShown)}</b>
            </div>
          )}
        </div>
      )}

      {expenseItems.length === 0 && !showForm && (
        <div className="empty">
          <div className="empty-icon">🧾</div>
          <p>No expenses logged yet.<br/>Tap <b>Log expense</b> to record a purchase.</p>
        </div>
      )}

      <div className="expense-days">
        {sortedDates.map(date => {
          const items = grouped[date];
          const dayTotal = items.reduce((s, e) => s + (Number(e.amount) || 0), 0);
          return (
            <div key={date} className="card">
              <div className="card-title">
                <span>{fmtDate(date)} <span className="weekday" style={{ marginLeft: 4 }}>{weekdayOf(date)}</span></span>
                <span className="title-amt" style={{ color: 'var(--loss)' }}>{fmt$(dayTotal)}</span>
              </div>
              {items.map(item => {
                const meta = catMeta(item.category);
                return (
                  <div key={item.id} className="exp-list-item">
                    <div className="exp-icon-wrap">{meta.icon}</div>
                    <div className="exp-body">
                      <div className="exp-desc">{item.description}</div>
                      <div className="exp-meta">
                        <span className={`exp-cat-pill ${meta.cls}`}>{item.category}</span>
                        {item.vendor && <span>📍 {item.vendor}</span>}
                        {item.jobId && (jobs || []).find(j => j.id === item.jobId) && <span className="job-link">🧾 {(jobs.find(j => j.id === item.jobId) || {}).client}</span>}
                      </div>
                    </div>
                    <div className="exp-side">
                      <div className="exp-amount">{fmt$(item.amount)}</div>
                      <div className="inline-row" style={{ gap: 4 }}>
                        <button className="btn btn-sm btn-edit" aria-label="Edit" onClick={() => openEdit(item)}><Icon name="edit" /></button>
                        <button className="btn btn-sm btn-danger" aria-label="Delete" onClick={() => handleDelete(item.id)}><Icon name="trash" /></button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── Employees / Crew Tab ──────────────────────────────────────
function EmployeesTab({ employees, jobs, reviewBonus }) {
  const [period, setPeriod] = useState('week');
  const [offset, setOffset] = useState(0); // 0 = current period, -1 = previous, etc.

  const changePeriod = p => { setPeriod(p); setOffset(0); };

  // Period date range, shifted back by `offset` days/weeks/months
  const todayStr = today();
  const [ty, tm, td] = todayStr.split('-').map(Number);
  const toStr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  let periodStart, periodEnd, label;
  if (period === 'today') {
    const d = new Date(ty, tm - 1, td + offset);
    periodStart = periodEnd = toStr(d);
    label = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  } else if (period === 'week') {
    const base = new Date(ty, tm - 1, td);
    const wkStart = new Date(base); wkStart.setDate(base.getDate() - base.getDay() + offset * 7);
    const wkEnd = new Date(wkStart); wkEnd.setDate(wkStart.getDate() + 6);
    periodStart = toStr(wkStart); periodEnd = toStr(wkEnd);
    label = wkStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' – ' + wkEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  } else {
    const mDate = new Date(ty, tm - 1 + offset, 1);
    periodStart = toStr(new Date(mDate.getFullYear(), mDate.getMonth(), 1));
    periodEnd   = toStr(new Date(mDate.getFullYear(), mDate.getMonth() + 1, 0));
    label = mDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  }
  // For the current/ongoing period, don't count days that haven't happened yet
  if (periodEnd > todayStr) periodEnd = todayStr;

  // Completed jobs in period, grouped per employee
  const inPeriod = (jobs || []).filter(j =>
    j.status === 'Completed' && j.dateStart >= periodStart && j.dateStart <= periodEnd);

  const rows = (employees || []).map(emp => {
    const empJobs = inPeriod.filter(j => jobEmployeeIds(j).includes(emp.id));
    // Revenue of jobs they worked on (full job value); commission/tips are their split share
    const revenue = empJobs.reduce((s, j) => s + (Number(j.revenue) || 0), 0);
    const commission = empJobs.reduce((s, j) => s + commissionForEmployeeOnJob(j, emp.id, employees), 0);
    const tips = empJobs.reduce((s, j) => s + tipForEmployeeOnJob(j, emp.id), 0);
    const bonuses = empJobs.reduce((s, j) => s + reviewBonusForEmployeeOnJob(j, emp.id, reviewBonus), 0);
    const reviewCount = inPeriod.filter(j => jobReviewCollectors(j).includes(emp.id)).length;
    return { emp, jobCount: empJobs.length, revenue, commission, tips, bonuses, reviewCount };
  }).sort((a, b) => (b.commission + b.tips + b.bonuses) - (a.commission + a.tips + a.bonuses));

  const unassigned = inPeriod.filter(j => !jobEmployeeIds(j).some(id => (employees || []).some(e => e.id === id)));
  const unassignedRev = unassigned.reduce((s, j) => s + (Number(j.revenue) || 0), 0);

  // Totals count each completed job once (a job shared by 2 techs isn't double-counted)
  const totalRev = inPeriod.reduce((s, j) => s + (Number(j.revenue) || 0), 0);
  const totalComm = rows.reduce((s, r) => s + r.commission, 0);
  const totalTips = rows.reduce((s, r) => s + r.tips, 0);
  const totalBonuses = rows.reduce((s, r) => s + r.bonuses, 0);
  // Count each job with a credited review collector once (shared credit is still one review)
  const totalReviews = inPeriod.filter(j => jobReviewCollectors(j).length > 0).length;
  // Tips on completed jobs with nobody assigned — flagged so they don't get lost
  const unassignedTips = inPeriod
    .filter(j => !jobEmployeeIds(j).some(id => (employees || []).some(e => e.id === id)))
    .reduce((s, j) => s + (Number(j.tip) || 0), 0);

  const unitName = period === 'today' ? 'day' : period === 'week' ? 'week' : 'month';

  return (
    <div>
      <div className="period-row">
        <PeriodTabs period={period} onChange={changePeriod} />
        <RangeNav label={label} offset={offset} unitName={unitName} setOffset={setOffset} />
      </div>

      {(employees || []).length === 0 ? (
        <div className="empty"><div className="empty-icon">👥</div><p>No employees yet.<br/>Add your crew in the Settings tab, then assign them to jobs.</p></div>
      ) : (
        <>
          {/* Summary banner */}
          <div className="stat-grid crew-stats">
            <div className="stat-card tone-info">
              <div className="stat-label">Crew Revenue</div>
              <div className="stat-value blue">{fmt$(totalRev)}</div>
              <div className="stat-sub">{label}</div>
            </div>
            <div className="stat-card tone-warn">
              <div className="stat-label">Commission Owed</div>
              <div className="stat-value orange">{fmt$(totalComm)}</div>
              <div className="stat-sub">{label}</div>
            </div>
            <div className="stat-card tone-profit">
              <div className="stat-label">Tips Collected</div>
              <div className="stat-value green">{fmt$(totalTips)}</div>
              <div className="stat-sub">{label}</div>
            </div>
            <div className="stat-card tone-gold">
              <div className="stat-label">Review Bonuses</div>
              <div className="stat-value gold">{fmt$(totalBonuses)}</div>
              <div className="stat-sub">{totalReviews} review{totalReviews !== 1 ? 's' : ''} × {fmt$(reviewBonus)}</div>
            </div>
            <div className="stat-card hero">
              <div className="stat-label">Total Payout</div>
              <div className="stat-value">{fmt$(totalComm + totalTips + totalBonuses)}</div>
              <div className="stat-sub">commission + tips + bonuses</div>
            </div>
          </div>

          {unassignedTips > 0 && (
            <div className="info-note note-warn">
              ⚠ {fmt$(unassignedTips)} in tips is on completed jobs with no tech assigned. Assign a tech on those jobs so the tip gets credited.
            </div>
          )}

          <div className="crew-list">
            {rows.map(({ emp, jobCount, revenue, commission, tips, bonuses, reviewCount }) => (
              <div key={emp.id} className="card">
                <div className="list-item-header">
                  <div className="person">
                    <div className="avatar">{initialsOf(emp.name)}</div>
                    <div>
                      <div className="list-item-title">{emp.name}</div>
                      <div className="list-item-sub">{jobCount} job{jobCount !== 1 ? 's' : ''} completed · {reviewCount} review{reviewCount !== 1 ? 's' : ''} collected</div>
                    </div>
                  </div>
                  <div className="entry-profit">
                    <div className="calc-value green">{fmt$(commission + tips + bonuses)}</div>
                    <div className="margin-pct-label">total payout</div>
                  </div>
                </div>
                <div className="detail-grid two">
                  <div className="detail-grid-item"><div className="dg-label">Revenue</div><div className="dg-value">{fmt$(revenue)}</div></div>
                  <div className="detail-grid-item"><div className="dg-label">Commission {Number(emp.commissionRate) > 0 ? `(${emp.commissionRate}%)` : ''}</div><div className="dg-value orange">{fmt$(commission)}</div></div>
                  <div className="detail-grid-item"><div className="dg-label">🎁 Tips</div><div className="dg-value green">{fmt$(tips)}</div></div>
                  <div className="detail-grid-item"><div className="dg-label">⭐ Review Bonus</div><div className="dg-value gold">{fmt$(bonuses)}</div></div>
                </div>
              </div>
            ))}

            {unassigned.length > 0 && (
              <div className="card tone-muted">
                <div className="list-item-header">
                  <div>
                    <div className="list-item-title" style={{ color: 'var(--muted)' }}>Unassigned Jobs</div>
                    <div className="list-item-sub">{unassigned.length} completed job{unassigned.length !== 1 ? 's' : ''} with no employee</div>
                  </div>
                  <div className="entry-profit">
                    <div className="calc-value blue">{fmt$(unassignedRev)}</div>
                    <div className="margin-pct-label">revenue</div>
                  </div>
                </div>
              </div>
            )}
          </div>
        </>
      )}
    </div>
  );
}

  const [feeRate, setFeeRate] = useState(() => LS.get('cpw_feeRate', 3));

  // Auth + sync state
  const [user, setUser]           = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [syncState, setSyncState] = useState('synced'); // synced | saving | error
  const snapshotUnsub             = useRef(null);
  const lastCloudJSON             = useRef('');
  const cloudReady                = useRef(false);
