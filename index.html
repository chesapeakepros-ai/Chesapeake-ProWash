  const retryPending              = useRef(false);
  const retryTimer                = useRef(null);
  const localUpdatedAt            = useRef(LS.get('cpw_updatedAt', 0)); // version of our local data

  const userDoc = (uid) => db.collection('users').doc(uid).collection('data').doc('main');

  // How many records a dataset holds — used to refuse a shrink/wipe from a stale copy
  const recordCount = d => (d.entries||[]).length + (d.jobs||[]).length + (d.expenses||[]).length + (d.bills||[]).length + (d.employees||[]).length;
  const localSnapshot = () => ({
    entries:   LS.get('cpw_entries',   []),
    jobs:      LS.get('cpw_jobs',      []),
    expenses:  LS.get('cpw_expenses',  []),
    bills:     LS.get('cpw_bills',     []),
    employees: LS.get('cpw_employees', []),
    expenseCategories: LS.get('cpw_expenseCategories', []),
    laborRate: LS.get('cpw_laborRate', 30),
    reviewBonus: LS.get('cpw_reviewBonus', 20),
    feeRate: LS.get('cpw_feeRate', 3),
  });
  // Keep one rolling snapshot per day (last 14 days) so data is always recoverable locally.
  // Never let a smaller (possibly clobbered) snapshot replace a bigger one from the same day.
  const autoBackup = (data) => {
    try {
      const all = LS.get('cpw_backups', []);
      const existingToday = all.find(b => b.day === today());
      if (existingToday && recordCount(existingToday.data) > recordCount(data)) return;
      const list = all.filter(b => b.day !== today());
      list.push({ day: today(), ts: Date.now(), data });
      LS.set('cpw_backups', list.slice(-14));
    } catch (e) {}
  };

  const subscribeToCloud = (uid) => {
    if (snapshotUnsub.current) { snapshotUnsub.current(); snapshotUnsub.current = null; }
    snapshotUnsub.current = userDoc(uid).onSnapshot(snapshot => {
      cloudReady.current = true;
      if (snapshot.exists) {
        const d = snapshot.data();
        const incoming = {
          entries:   d.entries   || [],
          jobs:      d.jobs      || [],
          expenses:  d.expenses  || [],
          bills:     d.bills     || [],
          employees: d.employees || [],
          expenseCategories: d.expenseCategories || [],
          laborRate: d.laborRate ?? 30,
          reviewBonus: d.reviewBonus ?? 20,
          feeRate: d.feeRate ?? 3,
        };
        const incomingJSON = JSON.stringify(incoming);
        // Skip only if this is our own write echoing back unchanged. (We used to also
        // bail out here whenever a local save was in-flight or retrying — but that let
        // a device with ANY stuck/failing save go permanently deaf to updates from other
        // devices, since it would never re-check once the retry eventually succeeded on
        // its own. The timestamp-based adopt logic below is what actually protects
        // against clobbering, so it alone decides whether to accept incoming data.)
        if (incomingJSON === lastCloudJSON.current) return;

        // ── Anti-clobber guard ──
        // Only adopt the cloud copy if it's genuinely newer than our local data.
        // A stale/emptier copy (older version, or fewer records at the same version)
        // must NOT overwrite newer local data — instead we re-push ours to heal the cloud.
        const cloudTs = Number(d.updatedAt) || 0;
        const localTs = Number(localUpdatedAt.current) || 0;
        const local   = localSnapshot();
        const localHasData = recordCount(local) > 0;
        const adopt = !localHasData
          || cloudTs > localTs
          || (cloudTs === localTs && recordCount(incoming) >= recordCount(local));

        if (adopt) {
          lastCloudJSON.current = incomingJSON;
          localUpdatedAt.current = cloudTs;
          LS.set('cpw_updatedAt', cloudTs);
          setEntries(incoming.entries);
          setJobs(incoming.jobs);
          setExpenseItems(incoming.expenses);
          setBills(incoming.bills);
          setEmployees(incoming.employees);
          setExpenseCategories(incoming.expenseCategories);
          setLaborRate(incoming.laborRate);
          setReviewBonus(incoming.reviewBonus);
          setFeeRate(incoming.feeRate);
        } else if (!isSaving.current) {
          // Cloud is older/smaller than our local — keep ours and push it back up.
          // (Skip if a save is already in flight so we don't fire overlapping writes;
          // that in-flight save already carries our current, newer version.)
          const json = JSON.stringify(local);
          const ts = Math.max(localTs, cloudTs) + 1;
          doCloudSave(uid, json, ts);
        }
      } else {
        // No cloud doc yet — seed it from local data
        const seed = localSnapshot();
        const ts = Math.max(Number(localUpdatedAt.current) || 0, Date.now());
        doCloudSave(uid, JSON.stringify(seed), ts);
      }
    });
  };

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(u => {
      setUser(u);
      setAuthReady(true);
      if (u) {
        subscribeToCloud(u.uid);
      } else {
        if (snapshotUnsub.current) { snapshotUnsub.current(); snapshotUnsub.current = null; }
      }
    });
    return () => { unsub(); if (snapshotUnsub.current) snapshotUnsub.current(); };
  }, []);

  // Cloud save with retry. lastCloudJSON is only updated after a CONFIRMED
  // write, so a failed save gets retried instead of silently lost.
  const doCloudSave = (uidVal, contentJson, ts) => {
    clearTimeout(retryTimer.current);
    isSaving.current = true;
    localUpdatedAt.current = ts;          // our local data is now this version
    LS.set('cpw_updatedAt', ts);
    setSyncState('saving');
    try {
      // Write the content plus its version stamp
      const payload = { ...JSON.parse(contentJson), updatedAt: ts };
      userDoc(uidVal).set(payload)
        .then(() => {
          lastCloudJSON.current = contentJson;
          isSaving.current = false;
          retryPending.current = false;
          setSyncState('synced');
        })
        .catch(() => {
          isSaving.current = false;
          retryPending.current = true;
          setSyncState('error');
          retryTimer.current = setTimeout(() => doCloudSave(uidVal, contentJson, ts), 8000);
        });
    } catch(e) {
      isSaving.current = false;
      retryPending.current = true;
      setSyncState('error');
    }
  };

  // Save to localStorage always; save to Firestore immediately when data changes.
  useEffect(() => {
    LS.set('cpw_entries',   entries);
    LS.set('cpw_jobs',      jobs);
    LS.set('cpw_expenses',  expenseItems);
    LS.set('cpw_bills',     bills);
    LS.set('cpw_employees', employees);
    LS.set('cpw_expenseCategories', expenseCategories);
    LS.set('cpw_laborRate', laborRate);
    LS.set('cpw_reviewBonus', reviewBonus);
    LS.set('cpw_feeRate', feeRate);

    const data = { entries, jobs, expenses: expenseItems, bills, employees, expenseCategories, laborRate, reviewBonus, feeRate };
    const json = JSON.stringify(data);
    if (json === lastCloudJSON.current) return; // nothing changed since last sync

    autoBackup(data); // keep a rolling local snapshot every time data changes

    if (!user || !cloudReady.current) return;
    doCloudSave(user.uid, json, Date.now());
  }, [entries, jobs, expenseItems, bills, employees, expenseCategories, laborRate, reviewBonus, feeRate, user]);

  const signIn  = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  const signOut = () => {
    auth.signOut();
    cloudReady.current = false;
    clearTimeout(retryTimer.current);
    retryPending.current = false;
    if (snapshotUnsub.current) { snapshotUnsub.current(); snapshotUnsub.current = null; }
  };

  // Restore from a JSON backup - replaces all state, which then syncs to cloud
  const importData = (d) => {
    setEntries(Array.isArray(d.entries) ? d.entries : []);
    setJobs(Array.isArray(d.jobs) ? d.jobs : []);
    setExpenseItems(Array.isArray(d.expenses) ? d.expenses : []);
    setBills(Array.isArray(d.bills) ? d.bills : []);
    setEmployees(Array.isArray(d.employees) ? d.employees : []);
    setExpenseCategories(Array.isArray(d.expenseCategories) ? d.expenseCategories : []);
    setLaborRate(Number(d.laborRate) || 30);
    setReviewBonus(d.reviewBonus == null ? 20 : Number(d.reviewBonus));
    setFeeRate(d.feeRate == null ? 3 : Number(d.feeRate));
  };

  // Clear everything: local AND cloud, then reload fresh
  const clearAllData = () => {
    if (!confirm('Delete ALL data on this device AND in the cloud? This cannot be undone.')) return;
    if (snapshotUnsub.current) { snapshotUnsub.current(); snapshotUnsub.current = null; }
    clearTimeout(retryTimer.current);
    ['cpw_entries','cpw_jobs','cpw_expenses','cpw_bills','cpw_employees','cpw_expenseCategories','cpw_laborRate','cpw_reviewBonus','cpw_feeRate'].forEach(k => localStorage.removeItem(k));
    const done = () => window.location.reload();
    if (user) userDoc(user.uid).delete().then(done).catch(done);
    else done();
  };

  const tabs = [
    { id: 'daily',    label: 'Daily',     icon: 'daily'    },
    { id: 'jobs',     label: 'Jobs',      icon: 'jobs'     },
    { id: 'expenses', label: 'Expenses',  icon: 'expenses' },
    { id: 'employees',label: 'Crew',      icon: 'crew'     },
    { id: 'bills',    label: 'Bills',     icon: 'bills'    },
    { id: 'dash',     label: 'Dashboard', icon: 'dash'     },
    { id: 'settings', label: 'Settings',  icon: 'settings' },
  ];
  const tabIdx = Math.max(0, tabs.findIndex(t => t.id === tab));
  const goTab = id => { setTab(id); try { window.scrollTo(0, 0); } catch (e) {} };

  // Page title + one-line summary, shown above each tab
  const monthlyBills = bills.reduce((s, b) => s + (Number(b.amount) || 0), 0);
  const awaitingPay = jobs.filter(j => j.status === 'Completed' && !j.paid).length;
  const expenseTotal = expenseItems.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const plural = (n, word) => `${n} ${word}${n !== 1 ? 's' : ''}`;
  const [pageTitle, pageSub] = {
    daily:     ['Daily Log', plural(entries.length, 'day') + ' logged'],
    jobs:      ['Jobs', plural(jobs.length, 'job') + (awaitingPay ? ` · ${awaitingPay} awaiting payment` : '')],
    expenses:  ['Expenses', plural(expenseItems.length, 'expense') + ` · ${fmt$(expenseTotal)} total`],
    employees: ['Crew', 'Commission, tips and review bonuses'],
    bills:     ['Monthly Bills', `${fmt$(monthlyBills)}/mo fixed overhead`],
    dash:      ['Dashboard', 'Profit, costs and money owed'],
    settings:  ['Settings', 'Sync, rates, crew and backups'],
  }[tab] || ['', ''];

  const syncLabel = syncState === 'saving' ? 'Saving…' : syncState === 'error' ? 'Retrying…' : 'Synced';
  const syncButton = user ? (
    <button className="sync-pill" onClick={() => goTab('settings')}
      title={syncState === 'error' ? 'Save failed — retrying…' : (user.displayName || 'Synced')}>
      {user.photoURL && <img src={user.photoURL} alt="" />}
      <span className="sync-name desktop-only">{user.displayName}</span>
      <span className={'sync-dot' + (syncState === 'saving' ? ' saving' : syncState === 'error' ? ' error' : '')} />
      <span className="sync-state">{syncLabel}</span>
    </button>
  ) : authReady ? (
    <button className="sync-pill signed-out" onClick={signIn}><Icon name="cloud" /><span>Sign in<span className="pill-extra"> to sync</span></span></button>
  ) : null;

  return (
    <>
      <header className="app-header">
        <div className="header-inner">
          <div className="brand mobile-only">
            <div className="brand-mark"><Logo /></div>
            <div className="brand-text">
              <div className="brand-name">CHESAPEAKE <span>PRO WASH</span></div>
              <div className="brand-tag">Profitability Tracker</div>
            </div>
          </div>
          <div className="header-title desktop-only">
            <div className="page-title">{pageTitle}</div>
            <div className="page-sub">{pageSub}</div>
          </div>
          <div className="header-actions mobile-only">
            {syncButton}
            <button className={'icon-tab' + (tab === 'settings' ? ' active' : '')} aria-label="Settings" onClick={() => goTab('settings')}>
              <Icon name="settings" />
            </button>
          </div>
        </div>
        <Waves />
      </header>

      <main className="content">
        <div className="page-head mobile-only">
          <div className="page-title">{pageTitle}</div>
          <div className="page-sub">{pageSub}</div>
        </div>
        <div key={tab} className="page-enter">
          {tab === 'daily'    && <DailyTab    entries={entries} setEntries={setEntries} jobs={jobs} laborRate={laborRate} expenseItems={expenseItems} employees={employees} bills={bills} feeRate={feeRate} />}
          {tab === 'jobs'     && <JobsTab     jobs={jobs} setJobs={setJobs} entries={entries} setEntries={setEntries} laborRate={laborRate} employees={employees} expenseItems={expenseItems} reviewBonus={reviewBonus} feeRate={feeRate} />}
          {tab === 'expenses' && <ExpensesTab expenseItems={expenseItems} setExpenseItems={setExpenseItems} entries={entries} setEntries={setEntries} expenseCategories={expenseCategories} setExpenseCategories={setExpenseCategories} jobs={jobs} />}
          {tab === 'employees'&& <EmployeesTab employees={employees} jobs={jobs} reviewBonus={reviewBonus} />}
          {tab === 'bills'    && <BillsTab    bills={bills} setBills={setBills} expenseCategories={expenseCategories} setExpenseCategories={setExpenseCategories} />}
          {tab === 'dash'     && <DashboardTab entries={entries} jobs={jobs} setJobs={setJobs} laborRate={laborRate} expenseItems={expenseItems} bills={bills} employees={employees} reviewBonus={reviewBonus} feeRate={feeRate} />}
          {tab === 'settings' && <SettingsTab  laborRate={laborRate} setLaborRate={setLaborRate} entries={entries} setEntries={setEntries} jobs={jobs} setJobs={setJobs} expenseItems={expenseItems} bills={bills} employees={employees} setEmployees={setEmployees} expenseCategories={expenseCategories} setExpenseCategories={setExpenseCategories} reviewBonus={reviewBonus} setReviewBonus={setReviewBonus} feeRate={feeRate} setFeeRate={setFeeRate} user={user} syncState={syncState} signIn={signIn} signOut={signOut} onImport={importData} onClearAll={clearAllData} />}
        </div>
      </main>

      <nav className="tab-bar">
        <div className="nav-brand">
          <div className="brand-mark"><Logo /></div>
          <div className="brand-text">
            <div className="brand-name">CHESAPEAKE <span>PRO WASH</span></div>
            <div className="brand-tag">Profitability Tracker</div>
          </div>
        </div>
        <div className={'tab-list' + (tab === 'settings' ? ' settings-active' : '')} style={{ '--idx': tabIdx }}>
          <span className="tab-indicator" />
          {tabs.map(t => (
            <button key={t.id} className={`tab-btn${tab === t.id ? ' active' : ''}${t.id === 'settings' ? ' settings-tab' : ''}`}
              onClick={() => goTab(t.id)} aria-current={tab === t.id ? 'page' : undefined}>
              <Icon name={t.icon} />{t.label}
            </button>
          ))}
        </div>
        <div className="nav-foot">{syncButton}</div>
      </nav>
      <Toaster />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
